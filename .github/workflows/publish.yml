name: Publish

# Publishes @nginxui/plugin-sdk to npm when a version tag is pushed. The tag
# must match package.json, e.g. v0.1.0 for "version": "0.1.0". npm
# authenticates through trusted publishing (OIDC) bound to this workflow and
# the "npm" environment, so no long lived token is stored. Before the trusted
# publisher is set up on npmjs.com, an NPM_TOKEN secret in that environment is
# used instead. npm attaches a provenance statement that links the package to
# this workflow run.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11

      - name: Check that the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "${tag}" != "${version}" ]; then
            echo "tag v${tag} does not match package.json version ${version}"
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun test

      - name: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
