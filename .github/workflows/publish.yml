name: Publish

# Publishes @nginxui/plugin-sdk to npm when a version tag is pushed. The tag
# must match package.json, e.g. v0.1.0 for "version": "0.1.0". The token
# lives in the "npm" environment as NPM_TOKEN, so the environment can require
# a reviewer before anything is published. npm attaches a provenance
# statement that links the package to this workflow run.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Check that the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "${tag}" != "${version}" ]; then
            echo "tag v${tag} does not match package.json version ${version}"
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun test

      - name: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
